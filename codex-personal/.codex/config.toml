#:schema https://developers.openai.com/codex/config-schema.json

# Match the default effort used by the active Claude Code profile.
model_reasoning_effort = "medium"
project_doc_fallback_filenames = [".AGENTS.md"]

# Let Codex review approval requests on my behalf.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
model = "gpt-6.1-sol"

[projects."/home/adam/workspace/dotfiles"]
trust_level = "trusted"

[projects."/home/adam/workspace/noizwaves.cloud"]
trust_level = "trusted"

[projects."/home/adam/Downloads"]
trust_level = "trusted"

[tui]
screen_reader_detection_done = true

[tui.model_availability_nux]
gpt-6-astra = 1
"gpt-6.1-sol" = 4
